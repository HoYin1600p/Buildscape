plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.41-kappa'
}

group = 'com.kingodogo.buildscape.tools'
version = '1.0.0'
base.archivesName = 'buildscape-parity-dumper-fabric-TEST-ONLY'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

unimined.minecraft {
    version '1.18.2'
    mappings {
        intermediary()
        mojmap()
    }
    defaultRemapJar = true
    fabric { loader '0.16.14' }
}

sourceSets {
    main.java.srcDir '../shared/src/main/java'
    selfCheck {
        java.srcDir '../shared/src/selfCheck/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    selfCheckImplementation 'com.google.code.gson:gson:2.8.9'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.matching { it.name == 'remapJar' }.configureEach {
    prodNamespace 'intermediary'
    archiveClassifier = ''
    mixinRemap { enableBaseMixin() }
}
tasks.named('assemble') { dependsOn 'remapJar' }
tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
    manifest { attributes('Implementation-Title': 'TEST ONLY parity dumper') }
}

def selfCheck = tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    description = 'Checks the shared deterministic snapshot writer headlessly.'
    dependsOn tasks.named('selfCheckClasses')
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.parity.DeterministicJsonSelfCheck'
    args layout.buildDirectory.dir('self-check').get().asFile.absolutePath
}
tasks.named('check') { dependsOn selfCheck }
