plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined'
}

evaluationDependsOn(':common')
def commonProject = project(':common')
version = providers.gradleProperty('mod_version').get()
base.archivesName = 'buildscape-forge-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def mergedClassesDir = layout.buildDirectory.dir('merged/classes/main')
def forgeDevJar = layout.buildDirectory.file('forge-dev/forge-1.21.1-52.1.14.jar')

// Forge 1.20.5+ uses Mojang names in production as well as development.
// Unimined's modern FG3 transformer supports this without ForgeGradle.
unimined.minecraft {
    version '1.21.1'
    mappings { mojmap() }
    defaultRemapJar = false
    minecraftForge {
        loader '52.1.14'
        mixinConfig(['buildscape.mixins.json', 'buildscape.forge121.mixins.json'])
        accessTransformer file('src/main/resources/META-INF/accesstransformer.cfg')
    }
    runs {
        all {
            // Preserve Unimined's libraries and replace only project class directories
            // and the patched Minecraft jar's filename. Rebuilding runtimeClasspath
            // would lose the loader's launch-specific dependencies.
            def projectClassDirs = files(project.sourceSets.main.output.classesDirs,
                    commonProject.sourceSets.v121x.output.classesDirs).files
            // Snapshot entries before assigning back to avoid a self-referencing FileCollection.
            def loaderClasspath = files(classpath.files)
            def minecraftConfig = unimined.minecrafts[project.sourceSets.main]
            def bootstrapClasspath = configurations.forgeBootstrapRuntime.files
            def bootstrapNames = bootstrapClasspath.collect { it.name }.toSet()
            def launchClasspath = loaderClasspath.filter {
                !projectClassDirs.contains(it) && !minecraftConfig.isMinecraftJar(it.toPath()) &&
                        !it.name.startsWith('minecraft_forge_1.21.1-') && !bootstrapNames.contains(it.name)
            } + files(bootstrapClasspath, mergedClassesDir, forgeDevJar)
            classpath = launchClasspath
            // ForgeUserdevLaunchHandler matches a forge-<mc>-<forge> filename
            // prefix in legacyClassPath (or java.class.path), not jar contents.
            systemProperty 'legacyClassPath', launchClasspath.asPath
            dependsOn 'prepareForgeDevJar'
            // FML's mod locator must also discover the merged output, rather than
            // the original loader-only class directory.
            environment 'MOD_CLASSES', files(mergedClassesDir,
                    project.sourceSets.main.output.resourcesDir).files.collect {
                "buildscape%%${it.absolutePath}"
            }.join(File.pathSeparator)
        }
    }
}

configurations {
    commonVariant
    forgeBootstrapRuntime
}
dependencies {
    // Bootstrap builds a new JPMS layer and requires the published module descriptors.
    // Keep Unimined's existing ASM/securemodules versions; only replace bootstrap artifacts.
    forgeBootstrapRuntime('net.minecraftforge:bootstrap:2.1.8') { transitive = false }
    forgeBootstrapRuntime('net.minecraftforge:bootstrap-api:2.1.8') { transitive = false }
    commonVariant project(path: ':common', configuration: 'v121xElements')
    compileOnly files(commonProject.sourceSets.v121x.output.classesDirs)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

// Both development and production process only the complete v121x resource tree.
sourceSets.main.resources.srcDir rootProject.file('common/src/v121x/resources')

tasks.named('compileJava') { dependsOn ':common:compileV121xJava' }

// Use Unimined's fully patched, Mojang-mapped and access-transformed dev jar.
// Only its filename changes; this copy is never included in the release jar.
tasks.register('prepareForgeDevJar', Copy) {
    from providers.provider { unimined.minecrafts[sourceSets.main].minecraftFileDev }
    into layout.buildDirectory.dir('forge-dev')
    rename { forgeDevJar.get().asFile.name }
}

// Forge creates a JPMS module for each runtime class directory. Merge loader and
// shared classes into one dev output, rather than exposing v121x as a second module.
// Keep javac's own destination separate so Sync can remove stale shared classes
// without deleting the loader compiler's output.
def mergeV121xClasses = tasks.register('mergeV121xClasses', Sync) {
    dependsOn tasks.named('compileJava'), ':common:compileV121xJava'
    from tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }
    from commonProject.sourceSets.v121x.output.classesDirs
    into mergedClassesDir
}
tasks.named('classes') { dependsOn mergeV121xClasses }
tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') { expand mod_version: project.version }
    filesMatching('assets/buildscape/models/**/*.json') {
        filter { line -> line.replace('"neoforge_data":', '"forge_data":') }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar) {
    from(configurations.commonVariant) {
        filesMatching('assets/buildscape/models/**/*.json') {
            filter { line -> line.replace('"neoforge_data":', '"forge_data":') }
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'MixinConfigs': 'buildscape.mixins.json,buildscape.forge121.mixins.json' }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
    options.compilerArgs += ['-proc:none']
}
tasks.withType(JavaExec).configureEach {
    dependsOn ':common:compileV121xJava', mergeV121xClasses
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    standardInput = System.in
}
tasks.named('check') { dependsOn ':common:v121xTest' }