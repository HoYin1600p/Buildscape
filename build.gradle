plugins {
    id 'base'
    id 'idea'
    id 'xyz.wagyourtail.unimined' version '1.4.41-kappa' apply false
}

defaultTasks 'build'

// Migration builds are explicit; the default build continues to verify 26.2/1.18.2.
if (findProject(':fabric:26.3') != null) {
    tasks.register('build263') {
        group = 'build'
        description = 'Builds the opt-in Fabric and NeoForge 26.3 targets'
        dependsOn ':fabric:26.3:build', ':neoforge:26.3:build'
    }
}

// Enabling the 1.21.1 loader also enables shared v121x verification, even when
// buildscape.v121x was not supplied separately on the command line.
if (findProject(':neoforge:1.21.1') != null || findProject(':fabric:1.21.1') != null || findProject(':forge:1.21.1') != null) {
    project(':common').tasks.matching { it.name == 'check' }.configureEach {
        dependsOn ':common:compileV121xJava'
    }
}

subprojects {
    if (childProjects.isEmpty()) {
        apply plugin: 'java'
        apply plugin: 'idea'
        group = 'com.kingodogo.buildscape'
        version = providers.gradleProperty('mod_version').get()

        java.toolchain.languageVersion = JavaLanguageVersion.of(25)
        repositories {
            mavenCentral()
            maven { url = 'https://libraries.minecraft.net/' }
            maven { url = 'https://maven.fabricmc.net/' }
            maven { url = 'https://maven.neoforged.net/releases/' }
            maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
        if (path != ':common') {
            base.archivesName = "buildscape-${parent.name}-${name}"
            // These loaders already expand metadata in their module build scripts.
            if (!(path in [':forge:1.18.2', ':fabric:1.18.2', ':fabric:1.21.1', ':neoforge:1.21.1', ':forge:1.21.1'])) {
                tasks.named('processResources', ProcessResources) {
                    inputs.property('mod_version', project.version)
                    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
                        expand(mod_version: project.version, version: project.version)
                    }
                }
            }
        }
    }
}

def loaderProjects = [project(':fabric:26.2'), project(':neoforge:26.2')]
def collectModJars = tasks.register('collectModJars', Copy) {
    group = 'build'
    description = 'Collects the Fabric and NeoForge 26.2 mod jars into build/libs'
    into layout.buildDirectory.dir('libs')
    loaderProjects.each { loader ->
        from loader.tasks.named('jar')
    }
}

tasks.named('assemble') { dependsOn collectModJars }
tasks.named('build') {
    dependsOn ':common:build', ':fabric:26.2:build', ':neoforge:26.2:build'
    if (findProject(':forge:1.18.2') != null) {
        dependsOn ':forge:1.18.2:build'
    }
    if (findProject(':neoforge:1.21.1') != null) {
        dependsOn ':neoforge:1.21.1:build'
    }
    if (findProject(':fabric:1.21.1') != null) {
        dependsOn ':fabric:1.21.1:build'
    }
}

if (findProject(':forge:1.21.1') != null) {
    project(':common').tasks.matching { it.name == 'check' }.configureEach {
        dependsOn ':common:compileV121xJava', ':common:v121xTest'
    }
    tasks.named('build') { dependsOn ':forge:1.21.1:build' }
}
