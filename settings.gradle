pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.outlands.top/releases' }
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

rootProject.name = 'Buildscape'

def resolveBuildscapeTarget() {
    def targetProp = gradle.startParameter.projectProperties.get('buildscape.target') ?:
            providers.gradleProperty('buildscape.target').orNull
    if (targetProp != null && !targetProp.trim().isEmpty()) {
        def normalized = targetProp.trim().toLowerCase().replaceAll('^:', '')
        if (normalized == 'neoforge' || normalized == 'neoforge262') return 'neoforge:26.2'
        if (normalized == 'fabric' || normalized == 'fabric262') return 'fabric:26.2'
        if (normalized == 'forge' || normalized == 'forge118' || normalized == 'forge1182') return 'forge:1.18.2'
        if (normalized == 'fabric118' || normalized == 'fabric1182') return 'fabric:1.18.2'
        if (normalized == 'neoforge263') return 'neoforge:26.3'
        if (normalized == 'fabric263') return 'fabric:26.3'
        if (normalized == 'forge263') return 'forge:26.3'
        return normalized
    }

    def tasks = gradle.startParameter.taskNames
    if (tasks.isEmpty()) {
        return 'all'
    }

    def rootAggregateTasks = ['build', 'check', 'assemble', 'collectModJars', 'clean', 'tasks', 'help', 'projects', 'properties']
    if (tasks.any { rootAggregateTasks.contains(it) }) {
        return 'all'
    }

    def targetChecks = [
        'fabric:1.18.2': tasks.any { it.contains('fabric:1.18.2') },
        'forge:1.18.2': tasks.any { it.contains('forge:1.18.2') },
        'fabric:1.21.1': tasks.any { it.contains('fabric:1.21.1') },
        'forge:1.21.1': tasks.any { it.contains('forge:1.21.1') },
        'neoforge:1.21.1': tasks.any { it.contains('neoforge:1.21.1') },
        'fabric:26.2': tasks.any { it.contains('fabric:26.2') },
        'forge:26.2': tasks.any { it.contains('forge:26.2') },
        'neoforge:26.2': tasks.any { it.contains('neoforge:26.2') },
        'fabric:26.3': tasks.any { it.contains('fabric:26.3') },
        'forge:26.3': tasks.any { it.contains('forge:26.3') },
        'neoforge:26.3': tasks.any { it.contains('neoforge:26.3') }
    ]
    def matches = targetChecks.findAll { it.value }.collect { it.key }
    if (matches.size() == 1) {
        return matches[0]
    }

    return 'all'
}

def activeTarget = resolveBuildscapeTarget()

include 'common'

if (activeTarget == 'neoforge:26.2') {
    include 'neoforge:26.2'
    project(':neoforge:26.2').projectDir = file('neoforge/26.2')
} else if (activeTarget == 'fabric:26.2') {
    include 'fabric:26.2'
    project(':fabric:26.2').projectDir = file('fabric/26.2')
} else if (activeTarget == 'forge:26.2') {
    include ':forge', ':forge:26.2'
    project(':forge').projectDir = file('forge')
    project(':forge:26.2').projectDir = file('forge/26.2')
} else if (activeTarget == 'forge:1.18.2') {
    include ':forge', ':forge:1.18.2'
    project(':forge').projectDir = file('forge')
    project(':forge:1.18.2').projectDir = file('forge/1.18.2')
} else if (activeTarget == 'fabric:1.18.2') {
    include ':fabric:1.18.2'
    project(':fabric:1.18.2').projectDir = file('fabric/1.18.2')
} else if (activeTarget == 'neoforge:1.21.1') {
    include ':neoforge:1.21.1'
    project(':neoforge:1.21.1').projectDir = file('neoforge/1.21.1')
} else if (activeTarget == 'fabric:1.21.1') {
    include ':fabric:1.21.1'
    project(':fabric:1.21.1').projectDir = file('fabric/1.21.1')
} else if (activeTarget == 'forge:1.21.1') {
    include ':forge', ':forge:1.21.1'
    project(':forge').projectDir = file('forge')
    project(':forge:1.21.1').projectDir = file('forge/1.21.1')
} else if (activeTarget == 'neoforge:26.3') {
    include ':neoforge:26.3'
    project(':neoforge:26.3').projectDir = file('neoforge/26.3')
} else if (activeTarget == 'fabric:26.3') {
    include ':fabric:26.3'
    project(':fabric:26.3').projectDir = file('fabric/26.3')
} else if (activeTarget == 'forge:26.3') {
    include ':forge', ':forge:26.3'
    project(':forge').projectDir = file('forge')
    project(':forge:26.3').projectDir = file('forge/26.3')
} else {
    // Default / 'all' mode: all versions and loaders registered
    def isEnabled = { String prop, boolean defVal = true ->
        def val = gradle.startParameter.projectProperties.get(prop) ?:
                providers.gradleProperty(prop).orNull
        return val != null ? val.trim().toLowerCase() == 'true' : defVal
    }

    // 26.2 targets
    include ':fabric:26.2'
    project(':fabric:26.2').projectDir = file('fabric/26.2')
    include ':neoforge:26.2'
    project(':neoforge:26.2').projectDir = file('neoforge/26.2')
    if (isEnabled('buildscape.forge262')) {
        include ':forge', ':forge:26.2'
        project(':forge').projectDir = file('forge')
        project(':forge:26.2').projectDir = file('forge/26.2')
    }

    // 1.18.2 targets
    if (isEnabled('buildscape.fabric118x')) {
        include ':fabric:1.18.2'
        project(':fabric:1.18.2').projectDir = file('fabric/1.18.2')
    }
    if (isEnabled('buildscape.v118x') || isEnabled('buildscape.forge118')) {
        include ':forge', ':forge:1.18.2'
        project(':forge').projectDir = file('forge')
        project(':forge:1.18.2').projectDir = file('forge/1.18.2')
    }

    // 1.21.1 targets
    if (isEnabled('buildscape.fabric121')) {
        include ':fabric:1.21.1'
        project(':fabric:1.21.1').projectDir = file('fabric/1.21.1')
    }
    if (isEnabled('buildscape.neoforge121')) {
        include ':neoforge:1.21.1'
        project(':neoforge:1.21.1').projectDir = file('neoforge/1.21.1')
    }
    if (isEnabled('buildscape.forge121')) {
        include ':forge', ':forge:1.21.1'
        project(':forge').projectDir = file('forge')
        project(':forge:1.21.1').projectDir = file('forge/1.21.1')
    }

    // 26.3 targets (experimental / migration, opt-in via -Pbuildscape.v263=true)
    if (isEnabled('buildscape.v263', false)) {
        include ':fabric:26.3', ':neoforge:26.3'
        project(':fabric:26.3').projectDir = file('fabric/26.3')
        project(':neoforge:26.3').projectDir = file('neoforge/26.3')
        if (isEnabled('buildscape.forge263', false)) {
            include ':forge', ':forge:26.3'
            project(':forge').projectDir = file('forge')
            project(':forge:26.3').projectDir = file('forge/26.3')
        }
    }
}
