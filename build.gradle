buildscript {
    repositories {

        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,7)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {


    mappings channel: mapping_channel, version: mapping_version


    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')


    runs {

        configureEach {
            workingDirectory project.file('run')


            property 'forge.logging.markers', 'REGISTRIES'


            property 'forge.logging.console.level', 'info'
        }

        client {

            property 'forge.enabledGameTestNamespaces', mod_id


            args '--username', 'Dev'


            jvmArgs '-Xmx4G', '-Xms2G'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'


            jvmArgs '-Xmx4G', '-Xms2G'
        }


        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {

            workingDirectory project.file('run-data')


            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"


    config "${mod_id}.mixins.json"


}


sourceSets {
    main {
        resources { srcDir 'src/generated/resources' }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://dvs1.progwml6.com/files/maven/' }
    maven { url = 'https://modmaven.dev' }
    mavenCentral()
}

def rendererApi = providers.gradleProperty('renderer_api').getOrElse('embeddium')
def rendererApiCoordinates = [
        embeddium: 'curse.maven:embeddium-908741:5322305',
        rubidium : 'curse.maven:rubidium-574856:4494903'
]

if (!rendererApiCoordinates.containsKey(rendererApi)) {
    throw new GradleException("Unknown renderer_api '${rendererApi}'. Use 'embeddium' or 'rubidium'.")
}

dependencies {


    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"


    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}:9.7.1.255")

    compileOnly fg.deobf(rendererApiCoordinates[rendererApi])


    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}



tasks.named('processResources', ProcessResources).configure {
    doNotTrackState("18k+ resource files causes incremental builds to hang during state tracking")

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties


    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/*.refmap.json'

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

}

tasks.named('compileJava', JavaCompile).configure {
    outputs.cacheIf { false }
}


tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(["Specification-Title"     : "buildscape",
                    "Specification-Vendor"    : "kingodogo",
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : "${version}",
                    "Implementation-Vendor"   : "kingodogo",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "${mod_id}.mixins.json"])
    }

    exclude { it.path.startsWith('.') || it.path.contains('..') }


}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-removal']
}

tasks.register('runPipeSpillTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.client.renderer.PipeSpillTest'
}

tasks.register('runPipeOutletTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.pipe.transport.PipeOutletWaterTest'
}

tasks.register('runRecipeManagerInjectorTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.integration.RecipeManagerInjectorTest'
}

tasks.register('runBinaryRecipeCacheTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.cache.BinaryRecipeCacheTest'
}

tasks.register('runTreeChopTraversalTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.util.TreeChopTraversalTest'
}

tasks.register('runBeaconBeamScanTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.util.BeaconBeamScanStateTest'
}

tasks.register('runGoldenDandelionGrowthTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.util.GoldenDandelionGrowthTest'
}

tasks.register('runMangroveLeafSupportTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.worldgen.MangroveLeafSupportTest'
}

tasks.register('runEyeblossomTransitionTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.block.EyeblossomTransitionTest'
}

tasks.register('runParticleColorSlotsTests', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.client.screen.ParticleColorSlotsTest'
}

tasks.register('syncBundledRecipeCache', JavaExec) {
    group = 'buildscape'
    description = 'Copies a verified local BDRE cache into the bundled recipe resources.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.cache.BundledRecipeCacheSync'
    args file('src/main/resources/data/buildscape/recipes_pack').absolutePath,
            file('run/buildscape/cache/recipes.bscb').absolutePath,
            file('src/main/resources/data/buildscape/recipes_pack/recipes.bscb').absolutePath
}

tasks.register('verifyBundledRecipeCache', JavaExec) {
    group = 'verification'
    description = 'Verifies that the bundled BDRE cache matches the compact recipe sources.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.cache.BundledRecipeCacheVerify'
    args file('src/main/resources/data/buildscape/recipes_pack').absolutePath,
            file('src/main/resources/data/buildscape/recipes_pack/recipes.bscb').absolutePath
}

tasks.named('check').configure {
    dependsOn 'runPipeSpillTests', 'runPipeOutletTests',
            'runRecipeManagerInjectorTests', 'runBinaryRecipeCacheTests', 'runTreeChopTraversalTests',
            'runBeaconBeamScanTests', 'runGoldenDandelionGrowthTests', 'runMangroveLeafSupportTests',
            'runEyeblossomTransitionTests', 'runParticleColorSlotsTests', 'verifyBundledRecipeCache'
}
