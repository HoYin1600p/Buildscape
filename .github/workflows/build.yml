name: build

on:
  pull_request:
    branches: [ main, 'dev/**', 'backport_*' ]
  push:
    branches: [ main, 'dev/**', 'backport_*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -Dsun.net.client.defaultConnectTimeout=60000 -Dsun.net.client.defaultReadTimeout=120000"

jobs:
  check:
    name: Check Run Eligibility
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            OPEN_PRS=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq 'length' 2>/dev/null || echo "0")
            if [ "${OPEN_PRS:-0}" -gt 0 ]; then
              echo "Open PR already exists for branch '${{ github.ref_name }}'; skipping duplicate push build."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  build:
    name: "MC ${{ matrix.minecraft }}"
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.18.2'
            tasks: ':fabric:1.18.2:assemble :forge:1.18.2:assemble'
            java: 17
          - minecraft: '1.19.2'
            tasks: ':fabric:1.19.2:assemble :forge:1.19.2:assemble'
            java: 17
          - minecraft: '1.20.1'
            tasks: ':fabric:1.20.1:assemble :forge:1.20.1:assemble :neoforge:1.20.1:assemble'
            java: 17
          - minecraft: '1.20.4'
            tasks: ':fabric:1.20.4:assemble :forge:1.20.4:assemble :neoforge:1.20.4:assemble'
            java: 17
          - minecraft: '1.20.6'
            tasks: ':fabric:1.20.6:assemble :forge:1.20.6:assemble :neoforge:1.20.6:assemble'
            java: 21
          - minecraft: '1.21.1'
            tasks: ':fabric:1.21.1:assemble :forge:1.21.1:assemble :neoforge:1.21.1:assemble'
            java: 21
          - minecraft: '1.21.4'
            tasks: ':fabric:1.21.4:assemble :forge:1.21.4:assemble :neoforge:1.21.4:assemble'
            java: 21
          - minecraft: '26.2'
            tasks: ':fabric:26.2:assemble :forge:26.2:assemble :neoforge:26.2:assemble'
            java: 25
          - minecraft: '26.3'
            tasks: ':fabric:26.3:assemble :forge:26.3:assemble :neoforge:26.3:assemble'
            java: 25
          - minecraft: '26.4'
            tasks: ':fabric:26.4:assemble'
            java: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize Target Submodules
        run: |
          if [ -f .gitmodules ]; then
            git submodule sync --recursive
            git submodule update --init --depth 1 shared "versions/${{ matrix.minecraft }}" || {
              for mod in shared "versions/${{ matrix.minecraft }}"; do
                rm -rf "$mod"
                branch=$(git config -f .gitmodules "submodule.${mod}.branch")
                sha=$(git ls-tree HEAD "$mod" | awk '{print $3}')
                url=$(git config -f .gitmodules "submodule.${mod}.url")
                git clone --depth 1 --branch "$branch" "$url" "$mod"
                git -C "$mod" fetch --depth 1 origin "$sha" || git -C "$mod" fetch --unshallow || true
                git -C "$mod" checkout "$sha"
              done
            }
          fi

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.java == 25 && 'zulu' || 'temurin' }}
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Targets
        run: |
          ./gradlew ${{ matrix.tasks }} --parallel --no-daemon --console=plain || \
          (sleep 10 && ./gradlew ${{ matrix.tasks }} --parallel --no-daemon --console=plain --refresh-dependencies)

      - name: Upload Target Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "buildscape-${{ matrix.minecraft }}"
          path: |
            build/${{ matrix.minecraft }}/*/libs/*.jar
            !build/${{ matrix.minecraft }}/*/libs/*-dev.jar
            !build/${{ matrix.minecraft }}/*/libs/*-sources.jar
          if-no-files-found: error

  dev-release:
    name: Publish Dev Pre-release
    needs: [check, build]
    if: >
      success() &&
      needs.check.outputs.should_run == 'true' &&
      github.ref != 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Download Built Jars
        uses: actions/download-artifact@v4
        with:
          pattern: buildscape-*
          path: raw-jars
          merge-multiple: true

      - name: Prepare Dev Release Metadata & Jars
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git submodule sync --recursive
          git submodule update --init --depth 1 shared || {
            rm -rf shared
            branch=$(git config -f .gitmodules "submodule.shared.branch")
            sha=$(git ls-tree HEAD shared | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.shared.url")
            git clone --depth 1 --branch "$branch" "$url" shared
            git -C shared fetch --depth 1 origin "$sha" || git -C shared fetch --unshallow || true
            git -C shared checkout "$sha"
          }
          MOD_VER=$(grep '^mod\.version=' shared/properties/mod.properties | cut -d'=' -f2 | tr -d '\r\n[:space:]')
          EFFECTIVE_VER="${MOD_VER}-dev.${{ github.run_number }}"
          TAG_NAME="v${EFFECTIVE_VER}"
          RELEASE_TITLE="[ Dev Build ${EFFECTIVE_VER} ]"

          mkdir -p release-jars
          find raw-jars -type f -name "*.jar" | while read -r f; do
            base=$(basename "$f" .jar)
            cp "$f" "release-jars/${base}-dev.${{ github.run_number }}.jar"
          done

          ls -la release-jars/
          JAR_COUNT=$(find release-jars -type f -name "*.jar" | wc -l | tr -d ' ')
          if [ "$JAR_COUNT" = "0" ]; then
            echo "No jars built; skipping release."
            echo "has_jars=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_jars=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

          TAG_NAME="$TAG_NAME" EFFECTIVE_VER="$EFFECTIVE_VER" JAR_COUNT="$JAR_COUNT" \
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}" COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}" \
          REPO_URL="${{ github.server_url }}/${{ github.repository }}" REPO_SLUG="${{ github.repository }}" \
          python3 - << 'EOF'
          import os, subprocess

          tag = os.environ['TAG_NAME']
          ver = os.environ['EFFECTIVE_VER']
          count = os.environ['JAR_COUNT']
          branch = os.environ['BRANCH_NAME']
          commit = os.environ['COMMIT_SHA']
          repo_url = os.environ['REPO_URL']
          repo_slug = os.environ['REPO_SLUG']
          short = commit[:7]

          commit_msg = ""
          try:
              commit_msg = subprocess.check_output(
                  ["gh", "api", f"repos/{repo_slug}/commits/{commit}", "--jq", ".commit.message"],
                  stderr=subprocess.DEVNULL, text=True
              ).strip()
          except Exception:
              pass

          lines = [
              f"### Build: `{ver}` ({count} jars)",
              f"- **Branch**: `{branch}`",
              f"- **Commit**: [`{short}`]({repo_url}/commit/{commit})",
              f"- **Tag**: [`{tag}`]({repo_url}/releases/tag/{tag})",
          ]
          if commit_msg:
              lines.append("")
              lines.append("### Changes")
              lines.append(commit_msg)

          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          EOF

      - name: Publish Dev Pre-release
        if: steps.meta.outputs.has_jars == 'true'
        uses: softprops/action-gh-release@c062e49c855a9e144a1eb6fef889d1469e38f170 # v2.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: ${{ steps.meta.outputs.release_title }}
          body_path: release_body.md
          files: release-jars/*.jar
          generate_release_notes: false
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
