name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-dev*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Explicit release tag (leave empty to use mod.properties version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Determine Release Tag
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            git submodule sync --recursive
            git submodule update --init --depth 1 shared || {
              rm -rf shared
              branch=$(git config -f .gitmodules "submodule.shared.branch")
              sha=$(git ls-tree HEAD shared | awk '{print $3}')
              url=$(git config -f .gitmodules "submodule.shared.url")
              git clone --depth 1 --branch "$branch" "$url" shared
              git -C shared fetch --depth 1 origin "$sha" || git -C shared fetch --unshallow || true
              git -C shared checkout "$sha"
            }
            MOD_VER=$(grep '^mod\.version=' shared/properties/mod.properties | cut -d'=' -f2 | tr -d ' \r\n')
            TAG="v${MOD_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target tag: ${TAG}"

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release '$TAG' already exists on GitHub; skipping duplicate release on main push."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Initialize Submodules
        if: steps.vars.outputs.should_release == 'true'
        run: |
          if [ -f .gitmodules ]; then
            git submodule sync --recursive
            git submodule update --init --recursive || {
              for mod in $(git config -f .gitmodules --get-regexp path | awk '{print $2}'); do
                rm -rf "$mod"
                branch=$(git config -f .gitmodules "submodule.${mod}.branch")
                sha=$(git ls-tree HEAD "$mod" | awk '{print $3}')
                url=$(git config -f .gitmodules "submodule.${mod}.url")
                git clone --depth 1 --branch "$branch" "$url" "$mod"
                git -C "$mod" fetch --depth 1 origin "$sha" || git -C "$mod" fetch --unshallow || true
                git -C "$mod" checkout "$sha"
              done
            }
          fi

      - name: Set up Java 17, 21, 25
        if: steps.vars.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        if: steps.vars.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        if: steps.vars.outputs.should_release == 'true'
        run: chmod +x ./gradlew

      - name: Assemble All Targets
        if: steps.vars.outputs.should_release == 'true'
        run: |
          ./gradlew buildAll --parallel --no-daemon --console=plain || \
          (sleep 10 && ./gradlew buildAll --parallel --no-daemon --console=plain --refresh-dependencies)

      - name: Collect Jars
        if: steps.vars.outputs.should_release == 'true'
        id: collect
        run: |
          mkdir -p release-jars
          find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" -exec cp {} release-jars/ \;
          echo "Collected jars:"
          ls -la release-jars/

      - name: Publish GitHub Release
        if: steps.vars.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.vars.outputs.tag }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release '$TAG_NAME' exists. Uploading artifacts..."
            gh release upload "$TAG_NAME" release-jars/*.jar --clobber
          else
            echo "Creating release '$TAG_NAME'..."
            gh release create "$TAG_NAME" release-jars/*.jar \
              --title "Buildscape $TAG_NAME" \
              --generate-notes
          fi
