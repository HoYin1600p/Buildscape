plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.41-kappa'
}

group = 'com.kingodogo.buildscape.tools'
version = '1.0.0'
base.archivesName = 'buildscape-parity-dumper-TEST-ONLY'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// A dedicated source set keeps Gradle's framework-based test task empty.
// Only the main output and cached Gson are needed, not Minecraft or a test framework.
sourceSets {
    selfCheck {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // Match Minecraft 1.18.2's Gson on both self-check classpaths.
    selfCheckImplementation 'com.google.code.gson:gson:2.8.9'
    // Match the working Forge module: Unimined's classpath does not supply jsr305.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Forge 40's cached/runtime command-line parser is 5.0.4, not Unimined's default.
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') {
        version { strictly '5.0.4' }
    }
}

unimined.minecraft {
    version '1.18.2'
    mappings {
        mojmap()
        searge()
    }
    defaultRemapJar = true
    minecraftForge {
        loader '40.3.12'
        useToolchains = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.matching { it.name == 'remapJar' }.configureEach {
    prodNamespace 'searge'
    archiveClassifier = ''
}
tasks.named('assemble') { dependsOn 'remapJar' }
tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
    manifest { attributes('Implementation-Title': 'TEST ONLY parity dumper') }
}

// No JUnit download or game bootstrap: exercise the same writer the mod uses.
def selfCheck = tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    description = 'Checks deterministic JSON output and snapshot filename sorting headlessly.'
    dependsOn tasks.named('selfCheckClasses')
    classpath = sourceSets.selfCheck.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.parity.DeterministicJsonSelfCheck'
    args layout.buildDirectory.dir('self-check').get().asFile.absolutePath
}
tasks.named('check') { dependsOn selfCheck }
