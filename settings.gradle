pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.outlands.top/releases' }
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

rootProject.name = 'Buildscape'
include 'common', 'fabric:26.2', 'neoforge:26.2'
project(':fabric:26.2').projectDir = file('fabric/26.2')
project(':neoforge:26.2').projectDir = file('neoforge/26.2')

if (providers.gradleProperty('buildscape.neoforge121').getOrElse('false') == 'true') {
    include ':neoforge:1.21.1'
    project(':neoforge:1.21.1').projectDir = file('neoforge/1.21.1')
}

if (providers.gradleProperty('buildscape.fabric118x').getOrElse('false') == 'true') {
    include ':fabric:1.18.2'
    project(':fabric:1.18.2').projectDir = file('fabric/1.18.2')
}

if (providers.gradleProperty('buildscape.fabric121').getOrElse('false') == 'true') {
    include ':fabric:1.21.1'
    project(':fabric:1.21.1').projectDir = file('fabric/1.21.1')
}

// Milestone 1: shared-code Forge 1.18.2 joins the default build.
// Use -Pbuildscape.v118x=false for the 26.2-only loader graph.
def v118xEnabled = gradle.startParameter.projectProperties.get('buildscape.v118x') ?:
        providers.gradleProperty('buildscape.v118x').getOrElse('true')
if (v118xEnabled == 'true') {
    include ':forge', ':forge:1.18.2'
    project(':forge').projectDir = file('forge')
    project(':forge:1.18.2').projectDir = file('forge/1.18.2')
}

// Parked by owner decision: Forge 26.x has no working toolchain;
// 26.3 follows after 26.2; Forge 1.18.2 is enabled above unless opted out.
// forge:26.2, forge:26.3, fabric:26.3, neoforge:26.3

if (providers.gradleProperty('buildscape.forge121').getOrElse('false') == 'true') {
    include ':forge', ':forge:1.21.1'
    project(':forge').projectDir = file('forge')
    project(':forge:1.21.1').projectDir = file('forge/1.21.1')
}