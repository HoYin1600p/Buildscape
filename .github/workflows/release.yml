name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Explicit release tag (leave empty to use mod.properties version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize Submodules
        run: |
          if [ -f .gitmodules ]; then
            git submodule sync --recursive
            git submodule update --init --recursive || {
              for mod in $(git config -f .gitmodules --get-regexp path | awk '{print $2}'); do
                rm -rf "$mod"
                branch=$(git config -f .gitmodules "submodule.${mod}.branch")
                sha=$(git ls-tree HEAD "$mod" | awk '{print $3}')
                url=$(git config -f .gitmodules "submodule.${mod}.url")
                git clone --depth 1 --branch "$branch" "$url" "$mod"
                git -C "$mod" fetch --depth 1 origin "$sha" || git -C "$mod" fetch --unshallow || true
                git -C "$mod" checkout "$sha"
              done
            }
          fi

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            MOD_VER=$(grep '^mod\.version=' properties/mod.properties | cut -d'=' -f2 | tr -d ' \r\n')
            TAG="v${MOD_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target tag: ${TAG}"

      - name: Set up Java 17, 21, 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Assemble All Targets
        run: |
          ./gradlew assembleAll --console=plain || ./gradlew assemble --console=plain || true

      - name: Collect Jars
        id: collect
        run: |
          mkdir -p release-jars
          find build -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" -exec cp {} release-jars/ \; || true
          echo "Collected jars:"
          ls -la release-jars/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.vars.outputs.tag }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release '$TAG_NAME' exists. Uploading artifacts..."
            gh release upload "$TAG_NAME" release-jars/*.jar --clobber
          else
            echo "Creating release '$TAG_NAME'..."
            gh release create "$TAG_NAME" release-jars/*.jar \
              --title "Buildscape $TAG_NAME" \
              --generate-notes
          fi
