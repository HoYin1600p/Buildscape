pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases/' }
    }
}

rootProject.name = 'Buildscape'


include 'common'

include 'forge:1.18.2'
include 'fabric:1.18.2'

include 'neoforge:1.21.1'
include 'fabric:1.21.1'
include 'forge:1.21.1'

include 'forge:26.2'
include 'forge:26.3'
include 'fabric:26.2'
include 'fabric:26.3'
include 'neoforge:26.2'
include 'neoforge:26.3'

project(':forge:1.18.2').projectDir = file('forge/1.18.2')
project(':fabric:1.18.2').projectDir = file('fabric/1.18.2')

project(':neoforge:1.21.1').projectDir = file('neoforge/1.21.1')
project(':fabric:1.21.1').projectDir = file('fabric/1.21.1')
project(':forge:1.21.1').projectDir = file('forge/1.21.1')

project(':forge:26.2').projectDir = file('forge/26.2')
project(':forge:26.3').projectDir = file('forge/26.3')
project(':fabric:26.2').projectDir = file('fabric/26.2')
project(':fabric:26.3').projectDir = file('fabric/26.3')
project(':neoforge:26.2').projectDir = file('neoforge/26.2')
project(':neoforge:26.3').projectDir = file('neoforge/26.3')
