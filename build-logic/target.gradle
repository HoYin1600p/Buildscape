buildscript {
    def template = project.hasProperty('templateRoot') ? file(project.property('templateRoot')) : (new File(rootProject.projectDir, "properties").isDirectory() ? rootProject.projectDir : rootProject.file('../../..'))
    project.ext.templateRoot = template
    def mc = project.findProperty('mc')
    if (!mc || mc == 'unspecified') {
        def m = project.name =~ /buildscape-([0-9.]+)-/
        if (m.find()) {
            mc = m.group(1)
        } else if (project.name.matches(/^[0-9.]+$/)) {
            mc = project.name
        } else {
            mc = '1.20.1'
        }
    }
    def loader = project.findProperty('loader')
    if (!loader || loader == 'unspecified') {
        def m = project.name =~ /buildscape-[0-9.]+-([a-z]+)/
        if (m.find()) {
            loader = m.group(1)
        } else if (project.parent != null && project.parent.name) {
            loader = project.parent.name
        } else {
            loader = 'fabric'
        }
    }
    def pins = new Properties()
    def pinFile = new File(template, "properties/${mc}.properties")
    if (!pinFile.isFile()) throw new GradleException("Unknown Minecraft target: ${mc}")
    pinFile.withInputStream { pins.load(it) }
    if (!pins.getProperty('loaders').split(',').contains(loader)) {
        throw new GradleException("${loader} is unavailable for ${mc}; see targets.json")
    }
    project.ext.targetPins = pins
    project.ext.targetMinecraft = mc
    project.ext.targetLoader = loader

    repositories {
        mavenCentral()
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.outlands.top/releases' }
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
        if (loader == 'fabric') {
            maven { url = 'https://maven.fabricmc.net/' }
        } else if (loader == 'forge') {
            maven { url = 'https://maven.minecraftforge.net/' }
        } else if (loader == 'neoforge') {
            maven { url = 'https://maven.neoforged.net/releases/' }
        }
        gradlePluginPortal {
            content {
                includeGroupByRegex 'gradle\\.plugin.*'
                includeGroupByRegex 'org\\.jetbrains.*'
                includeGroupByRegex 'xyz\\.wagyourtail.*'
            }
        }
    }
    dependencies {
        if (loader == 'fabric') {
            if (pins.getProperty('fabric.plugin') == 'xyz.wagyourtail.unimined') {
                classpath "xyz.wagyourtail.unimined:xyz.wagyourtail.unimined.gradle.plugin:${pins.getProperty('fabric.unimined', '1.4.41-kappa')}"
            } else {
                classpath "net.fabricmc:fabric-loom:${pins.getProperty('fabric.loom')}"
            }
        }
        if (loader == 'forge') {
            if (pins.getProperty('forge.plugin') == 'xyz.wagyourtail.unimined' || gradle.gradleVersion.startsWith('9')) {
                classpath "xyz.wagyourtail.unimined:xyz.wagyourtail.unimined.gradle.plugin:1.4.41-kappa"
            } else {
                classpath "net.minecraftforge.gradle:net.minecraftforge.gradle.gradle.plugin:${pins.getProperty('forge.gradle')}"
            }
        }
        if (loader == 'neoforge') {
            def plugin = pins.getProperty('neoforge.plugin')
            classpath "${plugin}:${plugin}.gradle.plugin:${pins.getProperty('neoforge.gradle')}"
        }
    }
}

apply plugin: 'java'
apply from: new File(templateRoot, 'build-logic/common.gradle')
apply from: new File(templateRoot, "build-logic/${targetLoader}.gradle")
