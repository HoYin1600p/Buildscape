plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined'
}

def replaceProperties = [
    'minecraft_version': '1.18.2',
    'minecraft_version_range': '[1.18.2,1.19)',
    'forge_version': '40.3.12',
    'forge_version_range': '[40,)',
    'loader_version_range': '[40,)',
    'mod_id': 'buildscape',
    'mod_name': 'Buildscape',
    'mod_license': 'All Rights Reserved',
    'mod_version': providers.gradleProperty('mod_version').getOrElse('4.0.3'),
    'mod_group_id': 'com.kingodogo.buildscape',
    'mod_authors': 'Kingodogo',
    'mod_description': 'Buildscape mod for Minecraft Forge 1.18.2'
]

group = replaceProperties.mod_group_id
version = providers.gradleProperty('mod_version').getOrElse(replaceProperties.mod_version)
base.archivesName = 'buildscape-forge-1.18.2'
replaceProperties.mod_version = version.toString()

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
def java17Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(17)
}

sourceSets.main {
    // Compile common source variant against Forge's Mojang dev jar.
    java.setSrcDirs(['src/main/java', rootProject.file('common/src/main/java'),
                     rootProject.file('common/src/v118x/java')])
    java.exclude 'com/kingodogo/buildscape/adapter/v121x/**'
    java.exclude 'com/kingodogo/buildscape/adapter/v26x/**'
    // Neutral mixins that target 26.2-only signatures and have a 1.18.2 replacement in this module.
    java.exclude 'com/kingodogo/buildscape/mixin/FlowingFluidMixin.java'
    java.exclude 'com/kingodogo/buildscape/mixin/StonecutterMenuAccessor.java'
    resources.setSrcDirs([rootProject.file('common/src/v118x/resources'), file('src/main/resources')])
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://dvs1.progwml6.com/files/maven/' }
    maven { url = 'https://modmaven.dev' }
}

// Unimined applies a user access transformer to the mojmap dev jar without translating SRG ids
// (f_xxxx_), so the dev copy replaces each id by the mojmap name from the line's trailing comment.
// The shipped META-INF/accesstransformer.cfg stays the byte-identical SRG original.
def devAccessTransformer = layout.buildDirectory.file('dev-at/accesstransformer.cfg').get().asFile
devAccessTransformer.parentFile.mkdirs()
def atSource = file('src/main/resources/META-INF/accesstransformer.cfg')
if (atSource.exists()) {
    devAccessTransformer.text = atSource.readLines('UTF-8').collect { String line ->
        def m = line =~ /^(\s*(?:public|protected|private|default)(?:[-+]f)?\s+\S+\s+)([fm]_\d+_)(\S*)\s*#\s*(\w+)\s*$/
        if (m.matches()) {
            return m.group(1) + m.group(4) + m.group(3)
        }
        if (line =~ /^[^#]*\b[fm]_\d+_/) {
            throw new GradleException("Access transformer line has an SRG id without a mojmap name comment: ${line}")
        }
        return line
    }.join('\n') + '\n'
} else {
    devAccessTransformer.text = ''
}

configurations {
    // Mod jars (SRG-named) that unimined remaps to the dev namespace; see unimined.minecraft.mods.
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

unimined.minecraft {
    version '1.18.2'
    mappings {
        mojmap()
        searge()
    }
    defaultRemapJar = true
    minecraftForge {
        loader '40.3.12'
        useToolchains = false
        mixinConfig(['buildscape.mixins.json', 'buildscape.forge118x.mixins.json'])
        accessTransformer devAccessTransformer
    }
    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // ForgeGradle's userdev classpath carries javax.annotation (jsr305); unimined's does not.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    implementation 'org.joml:joml:1.10.8'
    compileOnly 'org.jspecify:jspecify:1.0.0'
    modRuntimeOnly 'mezz.jei:jei-1.18.2:9.7.1.255'
    modCompileOnly 'curse.maven:embeddium-908741:5322305'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') {
        version { strictly '5.0.4' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    // Unimined generates the SRG refmap during remapJar instead of the ForgeGradle AP.
    options.compilerArgs += ['-Xlint:-removal', '-proc:none']
}
tasks.named('compileJava', JavaCompile) {
    outputs.cacheIf { false }
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = java17Launcher
    // Lets a dev server read console commands (for example "stop") from the shell's stdin.
    standardInput = System.in
}

// Text resources are normalised to LF so jar bytes do not depend on the checkout's line endings.
class CrlfToLfReader extends FilterReader {
    CrlfToLfReader(Reader reader) {
        super(new StringReader(reader.text.replace('\r\n', '\n')))
    }
}

tasks.named('processResources', ProcessResources) {
    doNotTrackState('18k+ resource files causes incremental builds to hang during state tracking')
    filteringCharset = 'UTF-8'
    filesMatching(['**/*.json', '**/*.cfg', '**/*.toml', '**/*.mcmeta', '**/*.txt', '**/*.lang']) {
        filter(CrlfToLfReader)
    }
    inputs.properties replaceProperties
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/*.refmap.json'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'Specification-Title': 'buildscape',
            'Specification-Vendor': 'kingodogo',
            'Specification-Version': '1',
            'Implementation-Title': 'buildscape',
            'Implementation-Version': version.toString(),
            'Implementation-Vendor': 'kingodogo',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'buildscape.mixins.json,buildscape.forge118x.mixins.json'
        ])
    }
    exclude { it.path.startsWith('.') || it.path.contains('..') }
}

// Unimined registers its default remap task after project evaluation. Keep this lazy.
tasks.matching { it.name == 'remapJar' }.configureEach {
    prodNamespace 'searge'
    archiveClassifier = ''
    mixinRemap {
        enableBaseMixin()
    }
}
tasks.named('assemble') {
    dependsOn 'remapJar'
}
