name: CI Build & Verify

on:
  push:
    branches:
      - main
      - buildscape-com
      - 'port/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Java versions for multi-cluster builds (17 for v118x, 21 for v121x, 25 for v26x)
      - name: Set up Java 17 (v118x)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Java 21 (v121x)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Java 25 (v26x & Gradle Runner)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Compile and Test
        run: |
          ./gradlew build -x test --console=plain
