pluginManagement {
    repositories {
        maven {
            url = 'https://maven.wagyourtail.xyz/releases'
            content { includeGroupByRegex 'xyz\\.wagyourtail.*' }
        }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        gradlePluginPortal()
        mavenCentral {
            content {
                excludeGroupByRegex 'xyz\\.wagyourtail.*'
                excludeGroupByRegex 'net\\.fabricmc.*'
                excludeGroupByRegex 'net\\.neoforged.*'
                excludeGroupByRegex 'net\\.minecraftforge.*'
            }
        }
        maven {
            url = 'https://maven-central.storage-download.googleapis.com/maven2/'
            content {
                excludeGroupByRegex 'xyz\\.wagyourtail.*'
                excludeGroupByRegex 'net\\.fabricmc.*'
                excludeGroupByRegex 'net\\.neoforged.*'
                excludeGroupByRegex 'net\\.minecraftforge.*'
            }
        }
    }
}

rootProject.name = 'Buildscape'

if (System.getenv('CI') == null && file('.githooks').isDirectory() && file('.git').exists()) {
    try {
        def p = new ProcessBuilder('git', 'config', '--get', 'core.hooksPath').directory(rootDir).start()
        def out = p.inputStream.text.trim()
        if (p.waitFor() != 0 || out != '.githooks') {
            new ProcessBuilder('git', 'config', 'core.hooksPath', '.githooks').directory(rootDir).start().waitFor()
        }
    } catch (Exception ignored) {}
}

def prepareTargetRoot(File rootDir, String mc, String loader) {
    def targetDir = new File(rootDir, ".gradle/build-roots/${mc}/${loader}")
    targetDir.mkdirs()
    new File(targetDir, 'settings.gradle').text = "rootProject.name = 'buildscape-${mc}-${loader}'\n"
    new File(targetDir, 'build.gradle').text = new File(rootDir, 'shared/build-logic/target.gradle').text
    def props = new File(rootDir, 'gradle.properties').text
    props += "\nmc=${mc}\nloader=${loader}\n"
    new File(targetDir, 'gradle.properties').text = props
    def localProps = new File(rootDir, 'local.properties')
    if (localProps.isFile()) {
        new File(targetDir, 'local.properties').text = localProps.text
    }
    return targetDir
}

def inventoryFile = file('targets.json')
def targetsData = []
if (inventoryFile.isFile()) {
    targetsData = new groovy.json.JsonSlurper().parse(inventoryFile)['targets']
}

def ensureLoaderProject(String loader) {
    def projPath = ":${loader}"
    if (findProject(projPath) == null) {
        def dir = file(".gradle/build-roots/${loader}")
        dir.mkdirs()
        include projPath
        project(projPath).projectDir = dir
    }
}

['fabric', 'forge', 'neoforge'].each { ensureLoaderProject(it) }

def tasks = gradle.startParameter.taskNames
def activeTargets = [] as Set

if (!tasks.isEmpty()) {
    def taskStr = tasks.join(' ')
    for (target in targetsData) {
        def mc = target['minecraft']
        target['loaders'].keySet().each { loader ->
            if (taskStr.contains(":${loader}:${mc}") || taskStr.contains("${loader}:${mc}")) {
                activeTargets << [mc: mc, loader: loader]
            }
        }
    }
}

def rootOnlyTasks = ['collectModJars', 'buildTarget', 'cleanTarget', 'runClient', 'runServer'] as Set
if (!activeTargets.isEmpty()) {
    activeTargets.each { t ->
        ensureLoaderProject(t.loader)
        def projPath = ":${t.loader}:${t.mc}"
        include projPath
        def targetDir = prepareTargetRoot(rootDir, t.mc, t.loader)
        project(projPath).projectDir = targetDir
    }
} else if (tasks.isEmpty() || !tasks.every { it in rootOnlyTasks || it.startsWith('-') }) {
    targetsData.each { target ->
        def mc = target['minecraft']
        target['loaders'].each { loader, info ->
            if (info instanceof Map && info['status'] == 'upcoming') {
                return
            }
            ensureLoaderProject(loader)
            def projPath = ":${loader}:${mc}"
            include projPath
            def targetDir = prepareTargetRoot(rootDir, mc, loader)
            project(projPath).projectDir = targetDir
        }
    }
}
