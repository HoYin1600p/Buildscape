import java.security.MessageDigest

// Immutable official Mojang client artifact from the 26.2 version manifest.
// SHA-1 is the checksum published by Mojang for this exact download.
def clientSha1 = '2dc72797acbc1b63fc16a11c4ac393605f453754'
def clientUrl = "https://piston-data.mojang.com/v1/objects/${clientSha1}/client.jar"
def clientOutput = layout.buildDirectory.file('minecraft/minecraft-26.2-client.jar')
def uniminedClient = new File(gradle.gradleUserHomeDir,
        'caches/unimined/net/minecraft/minecraft/26.2/minecraft-26.2-client.jar')

def downloadMinecraft = tasks.register('downloadMinecraft26x') {
    group = 'build setup'
    description = 'Obtains and verifies the official, unobfuscated Minecraft 26.2 compile jar'
    inputs.property('url', clientUrl)
    inputs.property('sha1', clientSha1)
    outputs.file(clientOutput)
    // Verify cached bytes too, including on subsequent builds.
    outputs.upToDateWhen { false }
    doLast {
        def checksum = { File file ->
            def digest = MessageDigest.getInstance('SHA-1')
            file.withInputStream { stream ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, count)
                }
            }
            digest.digest().encodeHex().toString()
        }
        def destination = clientOutput.get().asFile
        if (destination.isFile() && checksum(destination) == clientSha1) {
            return
        }
        destination.parentFile.mkdirs()
        if (uniminedClient.isFile() && checksum(uniminedClient) == clientSha1) {
            // Reuse Unimined's public Mojang download, never a repository-local reference jar.
            java.nio.file.Files.copy(uniminedClient.toPath(), destination.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } else {
            if (gradle.startParameter.offline) {
                throw new GradleException('Official Minecraft 26.2 jar is not cached. Populate dependencies online before using --offline.')
            }
            def connection = URI.create(clientUrl).toURL().openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 30000
            connection.inputStream.withCloseable { input ->
                destination.withOutputStream { output -> output << input }
            }
        }
        if (checksum(destination) != clientSha1) {
            destination.delete()
            throw new GradleException('Minecraft 26.2 client jar failed Mojang SHA-1 verification')
        }
    }
}

dependencies {
    v26xCompileOnly files(clientOutput).builtBy(downloadMinecraft)
}
