def metadata = new Properties()
new File(templateRoot, 'shared/properties/mod.properties').withReader('UTF-8') { metadata.load(it) }
ext.modMetadata = metadata
group = metadata.getProperty('mod.group')
version = metadata.getProperty('mod.version')
buildDir = new File(templateRoot, "build/${targetMinecraft}/${targetLoader}")
base.archivesName = "${metadata.getProperty('mod.id')}-${targetMinecraft}-${targetLoader}"

repositories {
    maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
    mavenCentral()
    maven {
        name = 'SpongeMaven'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content {
            includeGroupByRegex 'org\\.spongepowered.*'
        }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
}

def jvmTarget = targetPins.getProperty('java.release').toInteger()
def toolchainVersion = jvmTarget == 16 ? 17 : jvmTarget

java {
    toolchain.languageVersion = JavaLanguageVersion.of(toolchainVersion)
    sourceCompatibility = JavaVersion.toVersion(targetPins.getProperty('java.release'))
    targetCompatibility = JavaVersion.toVersion(targetPins.getProperty('java.release'))
}

def commonJava = new File(templateRoot, 'shared/src/main/java')
def versionCommonJava = new File(versionRoot, 'common/src/main/java')
def versionLoaderJava = new File(versionRoot, "${targetLoader}/src/main/java")
def overriddenCommonFiles = [] as Set
def overriddenVersionCommonFiles = [] as Set
[versionCommonJava, versionLoaderJava].each { dir ->
    if (dir.isDirectory()) {
        dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name.endsWith('.java')) {
                def rel = dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                if (new File(commonJava, rel).isFile()) {
                    overriddenCommonFiles.add(rel)
                }
            }
        }
    }
}
if (versionLoaderJava.isDirectory() && versionCommonJava.isDirectory()) {
    versionLoaderJava.eachFileRecurse(groovy.io.FileType.FILES) { f ->
        if (f.name.endsWith('.java')) {
            def rel = versionLoaderJava.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (new File(versionCommonJava, rel).isFile()) {
                overriddenVersionCommonFiles.add(rel)
            }
        }
    }
}

sourceSets {
    main {
        java.setSrcDirs([commonJava, versionCommonJava, versionLoaderJava].findAll { it.isDirectory() })
        resources.setSrcDirs(([
            new File(versionRoot, "${targetLoader}/src/main/resources"),
            new File(versionRoot, 'common/src/main/resources'),
            new File(templateRoot, 'shared/src/main/resources')
        ]).findAll { it.isDirectory() })
    }
    test {
        java.setSrcDirs([new File(versionRoot, 'common/src/test/java')])
        resources.setSrcDirs([new File(versionRoot, 'common/src/test/resources')])
    }
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    maxParallelForks = Math.max(1, (int) (Runtime.runtime.availableProcessors() / 2))
    systemProperty 'templateRoot', templateRoot.absolutePath
    def mixinJson = new File(versionRoot, 'common/src/main/resources/buildscape.mixins.json')
    if (mixinJson.isFile()) {
        systemProperty 'buildscape.minecraft1182MixinConfig', mixinJson.absolutePath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (!overriddenCommonFiles.isEmpty() || !overriddenVersionCommonFiles.isEmpty()) {
        def commonPrefix = commonJava.absolutePath.replace('\\', '/') + '/'
        def versionCommonPrefix = versionCommonJava.isDirectory() ? (versionCommonJava.absolutePath.replace('\\', '/') + '/') : null
        source = source.filter { File f ->
            def path = f.absolutePath.replace('\\', '/')
            if (path.startsWith(commonPrefix)) {
                def rel = path.substring(commonPrefix.length())
                return !overriddenCommonFiles.contains(rel)
            }
            if (versionCommonPrefix != null && path.startsWith(versionCommonPrefix)) {
                def rel = path.substring(versionCommonPrefix.length())
                return !overriddenVersionCommonFiles.contains(rel)
            }
            return true
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    outputs.cacheIf { true }
    def values = [
        mod_id: metadata.getProperty('mod.id'),
        mod_name: metadata.getProperty('mod.name'),
        mod_version: version.toString(),
        version: version.toString(),
        mod_description: metadata.getProperty('mod.description'),
        mod_authors: metadata.getProperty('mod.authors', 'Kingodogo'),
        mod_homepage: metadata.getProperty('mod.homepage', 'https://buildscape.online'),
        mod_license: metadata.getProperty('mod.license'),
        minecraft_version: targetMinecraft,
        java_release: targetPins.getProperty('java.release'),
        loader_version: targetPins.getProperty("${targetLoader}.version", '')
    ]
    inputs.properties(values)
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand(values)
    }
    if (targetMinecraft in ['1.18.2', '1.19.2']) {
        exclude 'data/buildscape/loot_table/**'
        exclude 'data/buildscape/tags/block/**'
        exclude 'data/buildscape/tags/item/**'
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Implementation-Title': metadata.getProperty('mod.name'),
            'Implementation-Version': project.version,
            'Implementation-Vendor': metadata.getProperty('mod.authors', 'Kingodogo')
        )
    }
}
