plugins {
    id 'java-library'
    id 'xyz.wagyourtail.unimined'
}

def v263Enabled = providers.gradleProperty('buildscape.v263').getOrElse('false') == 'true'

sourceSets {
    main {
        java.srcDirs = []
        resources.srcDirs = []
    }

    v118x {
        java {
            srcDirs = ['src/main/java', 'src/v118x/java']
            exclude 'com/kingodogo/buildscape/adapter/v121x/**'
            exclude 'com/kingodogo/buildscape/adapter/v26x/**'
            exclude 'com/kingodogo/buildscape/adapter/v263/**'
        }
        resources.srcDirs = ['src/main/resources', 'src/v118x/resources']
    }

    v121x {
        java {
            srcDirs = ['src/main/java', 'src/v121x/java']
            exclude 'com/kingodogo/buildscape/adapter/v118x/**'
            exclude 'com/kingodogo/buildscape/adapter/v26x/**'
            exclude 'com/kingodogo/buildscape/adapter/v263/**'
        }
        // This cluster supplies a complete 1.21.1 resource tree.
        resources.srcDirs = ['src/v121x/resources']
    }

    v26x {
        java {
            srcDirs = ['src/main/java', 'src/v26x/java']
            exclude 'com/kingodogo/buildscape/adapter/v118x/**'
            exclude 'com/kingodogo/buildscape/adapter/v121x/**'
            exclude 'com/kingodogo/buildscape/adapter/v263/**'
        }
        resources.srcDirs = ['src/main/resources', 'src/v26x/resources']
    }

    test {
        compileClasspath += sourceSets.v26x.output
        runtimeClasspath += sourceSets.v26x.output
    }

    v118xTest {
        java.srcDirs = ['src/v118xTest/java']
        resources.srcDirs = []
        // Unimined may add the mapped Minecraft jar directly to the compile task.
        // Use that task's final classpath, including its vanilla libraries.
        def minecraftClasspath = files(provider { tasks.named('compileV118xJava', JavaCompile).get().classpath })
        compileClasspath += sourceSets.v118x.output + minecraftClasspath
        runtimeClasspath = files(rootProject.file('ref/forge/1.18.2/src/main/resources')) +
                runtimeClasspath + sourceSets.v118x.output + sourceSets.v118x.runtimeClasspath + minecraftClasspath
    }

    v121xTest {
        java.srcDirs = ['src/v121xTest/java']
        resources.srcDirs = ['src/v121xTest/resources']
        def minecraftClasspath = files(provider { tasks.named('compileV121xJava', JavaCompile).get().classpath })
        compileClasspath += sourceSets.v121x.output + minecraftClasspath
        runtimeClasspath += sourceSets.v121x.output + sourceSets.v121x.runtimeClasspath + minecraftClasspath
    }
}

// v26x remains 26.2. Only the opt-in graph creates the independent 26.3 cluster.
if (v263Enabled) {
    sourceSets {
        v263 {
            java {
                srcDirs = ['src/main/java', 'src/v263/java']
                exclude 'com/kingodogo/buildscape/adapter/v118x/**'
                exclude 'com/kingodogo/buildscape/adapter/v121x/**'
                exclude 'com/kingodogo/buildscape/adapter/v26x/**'
                // Only the v118x adapter uses this helper; 26.3 removed BlockStateProviderType.
                exclude 'com/kingodogo/buildscape/worldgen/WorldGenTypeHelper.java'
            }
            // The 26.3 overlay comes first: with EXCLUDE (below) it wins over same-path main resources.
            resources.srcDirs = ['src/v263/resources', 'src/main/resources']
        }
    }
    apply from: rootProject.file('gradle/v263-resources.gradle')
    tasks.named('processV263Resources') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        exclude v263RetiredMainResources
    }
    configurations {
        v263Elements { canBeResolved = false; canBeConsumed = true }
    }
    tasks.named('compileV263Java', JavaCompile) {
        options.release.set(25)
        options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '100000']
    }
    def v263ClusterResourcesDir = layout.buildDirectory.dir('resources/v263Cluster')
    def v263ClusterResources = tasks.register('v263ClusterResources', Sync) {
        from 'src/v263/resources'
        into v263ClusterResourcesDir
    }
    artifacts {
        add('v263Elements', sourceSets.v263.output.classesDirs.singleFile) {
            builtBy tasks.named('compileV263Java')
        }
        add('v263Elements', v263ClusterResourcesDir.get().asFile) {
            builtBy v263ClusterResources
        }
    }
}

// Compile shared 1.18.2 code against vanilla Mojang names, without a loader or ATs.
// Keep this compile in check so shared API changes are verified for both clusters.
unimined.minecraft(sourceSets.v118x) {
    version '1.18.2'
    mappings { mojmap() }
    defaultRemapJar = false
}

// Resolve Mojang-mapped 1.21.1 and its own vanilla library manifest publicly.
unimined.minecraft(sourceSets.v121x) {
    version '1.21.1'
    mappings { mojmap() }
    defaultRemapJar = false
}

configurations {
    v118xElements { canBeResolved = false; canBeConsumed = true }
    v121xElements { canBeResolved = false; canBeConsumed = true }
    v26xElements { canBeResolved = false; canBeConsumed = true }
    testImplementation.extendsFrom v26xCompileOnly
}

dependencies {
    v121xTestImplementation platform('org.junit:junit-bom:5.12.2')
    v121xTestImplementation 'org.junit.jupiter:junit-jupiter'
    v121xTestImplementation 'org.ow2.asm:asm-tree:9.7.1'
    v121xTestRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    v118xTestImplementation platform('org.junit:junit-bom:5.12.2')
    v118xTestImplementation 'org.junit.jupiter:junit-jupiter'
    v118xTestImplementation 'org.ow2.asm:asm-tree:9.7.1'
    v118xTestRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    // Vanilla bootstrap and codec dependencies for the 26.2 tests.
    testRuntimeOnly 'com.mojang:logging:1.7.12'
    testRuntimeOnly 'com.mojang:authlib:9.0.75'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.26.0'
    testRuntimeOnly 'org.apache.commons:commons-lang3:3.20.0'
    testRuntimeOnly 'io.netty:netty-codec-base:4.2.15.Final'
    testRuntimeOnly 'com.google.code.gson:gson:2.14.0'
    [
        'org.jspecify:jspecify:1.0.0',
        'com.mojang:datafixerupper:10.0.21',
        'com.mojang:brigadier:1.3.10',
        'org.joml:joml:1.10.8',
        'org.spongepowered:mixin:0.8.5',
        'org.ow2.asm:asm:9.7.1',
        'org.ow2.asm:asm-tree:9.7.1'
    ].each { dependency ->
        // Minecraft 1.18.2 supplies its own DFU and Brigadier versions through
        // Unimined. Newer versions change serialization methods used at bootstrap.
        if (!dependency.startsWith('com.mojang:')) v118xCompileOnly dependency
        // 1.21.1 supplies DFU, Brigadier and JOML through its own manifest.
        if (!dependency.startsWith('com.mojang:') && !dependency.startsWith('org.joml:')) {
            v121xCompileOnly dependency
        }
        v26xCompileOnly dependency
        if (v263Enabled) add('v263CompileOnly', dependency)
    }

    v26xCompileOnly 'com.google.code.gson:gson:2.10.1'

    // Gson and Netty for v118x also come from Minecraft's library manifest.
    // Nullable was previously supplied transitively by the newer DFU dependency.
    v118xCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    v121xCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Gson and Netty for v121x also come from Minecraft's library manifest.
    v26xCompileOnly 'io.netty:netty-buffer:4.2.15.Final'
    v26xCompileOnly 'it.unimi.dsi:fastutil:8.5.18'
    v26xCompileOnly 'org.jetbrains:annotations:26.0.2'
    v26xCompileOnly 'com.google.guava:guava:33.6.0-jre'
    v26xCompileOnly 'org.slf4j:slf4j-api:2.0.17'

    if (v263Enabled) {
        v263CompileOnly 'com.google.code.gson:gson:2.10.1'
        v263CompileOnly 'io.netty:netty-buffer:4.2.15.Final'
        v263CompileOnly 'it.unimi.dsi:fastutil:8.5.18'
        v263CompileOnly 'org.jetbrains:annotations:26.0.2'
        v263CompileOnly 'com.google.guava:guava:33.6.0-jre'
        v263CompileOnly 'org.slf4j:slf4j-api:2.0.17'
    }

}

tasks.named('compileV118xJava', JavaCompile) {
    options.release.set(17)
    // Preserve the migration baseline beyond javac's default 100-error limit.
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
tasks.named('compileV121xJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.release.set(21)
    // Capture the migration baseline beyond javac's default 100-error limit.
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
tasks.named('compileV118xTestJava', JavaCompile) { options.release.set(17) }
tasks.named('compileV121xTestJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.release.set(21)
}
tasks.named('compileV26xJava', JavaCompile) { options.release.set(25) }
tasks.named('compileTestJava', JavaCompile) { options.release.set(25) }
tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn tasks.named('v26xClasses')
    // Bootstrap mutates global registries; isolate suites in one JVM.
    maxParallelForks = 1
    workingDir = layout.buildDirectory.get().asFile
    // Lets tests read Buildscape's own resources rather than vanilla files at the same path.
    systemProperty 'buildscape.mainResources', file('src/main/resources').absolutePath
}

// Loader modules already copy shared resources directly. Supply only the cluster
// resources through their common variant, avoiding duplicate shared jar entries.
def v26xClusterResourcesDir = layout.buildDirectory.dir('resources/v26xCluster')
def v26xClusterResources = tasks.register('v26xClusterResources', Sync) {
    from 'src/v26x/resources'
    into v26xClusterResourcesDir
}

def v118xClusterResourcesDir = layout.buildDirectory.dir('resources/v118xCluster')
def v118xClusterResources = tasks.register('v118xClusterResources', Sync) {
    from 'src/v118x/resources'
    into v118xClusterResourcesDir
}

def v121xClusterResourcesDir = layout.buildDirectory.dir('resources/v121xCluster')
def v121xClusterResources = tasks.register('v121xClusterResources', Sync) {
    from 'src/v121x/resources'
    into v121xClusterResourcesDir
}

artifacts {
    add('v118xElements', sourceSets.v118x.output.classesDirs.singleFile) {
        builtBy tasks.named('compileV118xJava')
    }
    add('v118xElements', v118xClusterResourcesDir.get().asFile) {
        builtBy v118xClusterResources
    }
    add('v121xElements', sourceSets.v121x.output.classesDirs.singleFile) {
        builtBy tasks.named('compileV121xJava')
    }
    add('v121xElements', v121xClusterResourcesDir.get().asFile) {
        builtBy v121xClusterResources
    }
    add('v26xElements', sourceSets.v26x.output.classesDirs.singleFile) {
        builtBy tasks.named('compileV26xJava')
    }
    add('v26xElements', v26xClusterResourcesDir.get().asFile) {
        builtBy v26xClusterResources
    }
}

tasks.named('processResources') { enabled = false }

apply from: rootProject.file('gradle/minecraft.gradle')

tasks.named('jar', Jar) {
    from sourceSets.v26x.output
}
tasks.named('assemble') { dependsOn tasks.named('v26xClasses') }
// Follow the settings inclusion decision so the opt-out skips v118x verification.
def v118xEnabled = rootProject.findProject(':forge:1.18.2') != null
def v121xEnabled = providers.gradleProperty('buildscape.v121x').getOrElse('false') == 'true'
def v121xTestTask = tasks.register('v121xTest', Test) {
    group = 'verification'
    description = 'Audits every configured mixin against Minecraft 1.21.1 bytecode'
    dependsOn tasks.named('v121xTestClasses'), tasks.named('v121xClasses')
    testClassesDirs = sourceSets.v121xTest.output.classesDirs
    classpath = sourceSets.v121xTest.runtimeClasspath
    useJUnitPlatform()
    inputs.file(file('src/v121x/resources/buildscape.mixins.json'))
    systemProperty 'buildscape.v121xMixinConfig', file('src/v121x/resources/buildscape.mixins.json').absolutePath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    maxParallelForks = 1
    workingDir = layout.buildDirectory.get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named('check') {
    if (v118xEnabled) dependsOn tasks.named('compileV118xJava')
    if (v121xEnabled) dependsOn tasks.named('compileV121xJava'), v121xTestTask
}

def v118xStandaloneTests = [
        v118xRunPipeSpillTests: 'com.kingodogo.buildscape.client.renderer.PipeSpillTest',
        v118xRunPipeOutletTests: 'com.kingodogo.buildscape.pipe.transport.PipeOutletWaterTest',
        v118xRunTreeChopTraversalTests: 'com.kingodogo.buildscape.util.TreeChopTraversalTest',
        v118xRunBeaconBeamScanTests: 'com.kingodogo.buildscape.util.BeaconBeamScanStateTest',
        v118xRunGoldenDandelionGrowthTests: 'com.kingodogo.buildscape.util.GoldenDandelionGrowthTest',
        v118xRunMangroveLeafSupportTests: 'com.kingodogo.buildscape.worldgen.MangroveLeafSupportTest',
        v118xRunEyeblossomTransitionTests: 'com.kingodogo.buildscape.block.EyeblossomTransitionTest',
        v118xRunCopperRodLogicTests: 'com.kingodogo.buildscape.adapter.v118x.CopperRodLogicTest',
        v118xRunHazeBushResourcesTests: 'com.kingodogo.buildscape.block.HazeBushResourcesTest',
        v118xRunParticleColorSlotsTests: 'com.kingodogo.buildscape.client.screen.ParticleColorSlotsTest',
        v118xRunStairModelTests: 'com.kingodogo.buildscape.client.model.StairModelTest',
        v118xRunPatternBoundsTests: 'com.kingodogo.buildscape.recipe.framework.util.PatternBoundsTest',
        v118xRunRecipePackFormatterTests: 'com.kingodogo.buildscape.recipe.framework.util.RecipePackFormatterTest',
        v118xRunRecipeManagerInjectorTests: 'com.kingodogo.buildscape.recipe.framework.integration.RecipeManagerInjectorTest',
        v118xRunBinaryRecipeCacheTests: 'com.kingodogo.buildscape.recipe.framework.cache.BinaryRecipeCacheTest'
]
v118xStandaloneTests.each { taskName, testClass ->
    def runner = tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs ${testClass.tokenize('.').last()} against shared Minecraft 1.18.2 classes"
        dependsOn tasks.named('v118xTestClasses'), tasks.named('v118xClasses')
        classpath = sourceSets.v118xTest.runtimeClasspath
        mainClass = testClass
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        workingDir = layout.buildDirectory.get().asFile
        systemProperty 'buildscape.mainResources', rootProject.file('ref/forge/1.18.2/src/main/resources').absolutePath
        systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('tmp/v118xTests').get().asFile.absolutePath
        doFirst {
            workingDir.mkdirs()
            layout.buildDirectory.dir('tmp/v118xTests').get().asFile.mkdirs()
        }
    }
    tasks.named('check') {
        if (v118xEnabled) dependsOn runner
    }
}

def v118xTestTask = tasks.register('v118xTest', Test) {
    group = 'verification'
    description = 'Runs the reference recipe regression suite against shared 1.18.2 code'
    dependsOn tasks.named('v118xTestClasses'), tasks.named('v118xClasses')
    testClassesDirs = sourceSets.v118xTest.output.classesDirs
    classpath = sourceSets.v118xTest.runtimeClasspath
    useJUnitPlatform()
    inputs.file(file('src/v118x/resources/buildscape.mixins.json'))
    systemProperty 'buildscape.v118xMixinConfig', file('src/v118x/resources/buildscape.mixins.json').absolutePath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    // Bootstrap and stderr capture mutate JVM globals.
    maxParallelForks = 1
    workingDir = layout.buildDirectory.get().asFile
    systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('tmp/v118xTests').get().asFile.absolutePath
    doFirst {
        workingDir.mkdirs()
        layout.buildDirectory.dir('tmp/v118xTests').get().asFile.mkdirs()
    }
}
tasks.named('check') {
    if (v118xEnabled) dependsOn v118xTestTask
}

def v118xRecipePack = rootProject.file('ref/forge/1.18.2/src/main/resources/data/buildscape/recipes_pack')
def v118xRecipeToolClasspath = sourceSets.v118x.output +
        files(provider { tasks.named('compileV118xJava', JavaCompile).get().classpath })
def v118xVerifyBundledRecipeCache = tasks.register('v118xVerifyBundledRecipeCache', JavaExec) {
    group = 'verification'
    description = 'Verifies the frozen 1.18.2 bundled cache byte for byte against shared tooling'
    dependsOn tasks.named('v118xClasses')
    classpath = v118xRecipeToolClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.compiler.BundledRecipeCacheVerify'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    args v118xRecipePack.absolutePath, new File(v118xRecipePack, 'recipes.bscb').absolutePath
}
def v118xCheckRecipePackFormat = tasks.register('v118xCheckRecipePackFormat', JavaExec) {
    group = 'verification'
    description = 'Checks canonical formatting and duplicate keys in the frozen 1.18.2 recipe pack'
    dependsOn tasks.named('v118xClasses')
    classpath = v118xRecipeToolClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.util.RecipePackFormatter'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    args '--check', v118xRecipePack.absolutePath
}
tasks.named('check') {
    if (v118xEnabled) dependsOn v118xVerifyBundledRecipeCache, v118xCheckRecipePackFormat
}

// Explicit synchronization writes build output; the frozen reference remains an input.
tasks.register('v118xSyncBundledRecipeCache', JavaExec) {
    group = 'buildscape'
    description = 'Generates the 1.18.2 cache under common/build without changing reference inputs'
    dependsOn tasks.named('v118xClasses')
    classpath = v118xRecipeToolClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.compiler.RecipeCacheGenerator'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    inputs.files(fileTree(v118xRecipePack) { include '*.json' })
    def generatedCache = layout.buildDirectory.file('generated/v118xRecipeCache/recipes.bscb')
    outputs.file generatedCache
    args v118xRecipePack.absolutePath, generatedCache.get().asFile.absolutePath
    mustRunAfter v118xVerifyBundledRecipeCache, v118xCheckRecipePackFormat
}

// Explicit tooling only: no dependency from test, check, assemble or build.
tasks.register('dumpBlockStates', JavaExec) {
    group = 'showcase'
    description = 'Dumps every Buildscape block state against Minecraft 26.2'
    dependsOn tasks.named('testClasses'), tasks.named('v26xClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingodogo.buildscape.showcase.DumpBlockStates'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    workingDir = layout.buildDirectory.get().asFile
    systemProperty 'buildscape.mainResources', file('src/main/resources').absolutePath
    doFirst {
        workingDir.mkdirs()
        args = [providers.gradleProperty('showcaseOutput')
                .map { file(it).absolutePath }
                .getOrElse(layout.buildDirectory.file('showcase/blockstates.json').get().asFile.absolutePath)]
    }
}
