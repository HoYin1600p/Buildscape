def targetJavaRelease = targetPins.getProperty('java.release').toInteger()

if (targetPins.getProperty('neoforge.plugin') == 'xyz.wagyourtail.unimined' || targetMinecraft == '1.20.1') {
    apply plugin: 'xyz.wagyourtail.unimined'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaRelease)
    }

    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }

    unimined.minecraft {
        version targetMinecraft
        mappings {
            mojmap()
            searge()
        }
        defaultRemapJar = true
        neoForged {
            loader targetPins.getProperty('neoforge.version')
            mixinConfig(['buildscape.mixins.json', 'buildscape.neoforge.mixins.json'])
        }
    }
} else {
    apply plugin: targetPins.getProperty('neoforge.plugin')

    def isUserdev = targetPins.getProperty('neoforge.plugin') != 'net.neoforged.moddev'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(isUserdev ? Math.max(21, targetJavaRelease) : targetJavaRelease)
    }

    if (isUserdev) {
        tasks.withType(JavaCompile).configureEach {
            options.release.set(targetJavaRelease)
        }
    }

if (targetPins.getProperty('neoforge.plugin') == 'net.neoforged.moddev') {
    neoForge {
        version = targetPins.getProperty('neoforge.version')
        runs {
            client {
                client()
                gameDirectory = new File(templateRoot, "run/${targetMinecraft}/neoforge/client")
            }
            server {
                server()
                gameDirectory = new File(templateRoot, "run/${targetMinecraft}/neoforge/server")
            }
        }
        mods {
            buildscape {
                sourceSet sourceSets.main
            }
        }
    }
} else {
    dependencies {
        if (targetMinecraft == '1.20.1') {
            implementation "net.neoforged:forge:${targetMinecraft}-${targetPins.getProperty('neoforge.version')}"
        } else {
            implementation "net.neoforged:neoforge:${targetPins.getProperty('neoforge.version')}"
        }
    }
        runs {
            configureEach {
                modSource sourceSets.main
                workingDirectory = new File(templateRoot, "run/${targetMinecraft}/neoforge/${name}")
            }
            client {}
            server {}
        }
    }
}

gradle.projectsEvaluated {
    tasks.matching { it.name.startsWith('run') }.configureEach {
        doFirst {
            new File(templateRoot, "run/${targetMinecraft}/neoforge/client").mkdirs()
            new File(templateRoot, "run/${targetMinecraft}/neoforge/server").mkdirs()
        }
    }
}
