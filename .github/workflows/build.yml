name: build

on:
  pull_request:
    branches: [ main, 'dev/**', 'backport_*' ]
  push:
    branches: [ main, 'dev/**', 'backport_*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true -Dsun.net.client.defaultConnectTimeout=60000 -Dsun.net.client.defaultReadTimeout=120000"

jobs:
  build:
    name: "MC ${{ matrix.minecraft }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.18.2'
            tasks: ':fabric:1.18.2:assemble :forge:1.18.2:assemble'
            java: 17
          - minecraft: '1.19.2'
            tasks: ':fabric:1.19.2:assemble :forge:1.19.2:assemble'
            java: 17
          - minecraft: '1.20.1'
            tasks: ':fabric:1.20.1:assemble :forge:1.20.1:assemble :neoforge:1.20.1:assemble'
            java: 17
          - minecraft: '1.20.4'
            tasks: ':fabric:1.20.4:assemble :forge:1.20.4:assemble :neoforge:1.20.4:assemble'
            java: 17
          - minecraft: '1.20.6'
            tasks: ':fabric:1.20.6:assemble :forge:1.20.6:assemble :neoforge:1.20.6:assemble'
            java: 21
          - minecraft: '1.21.1'
            tasks: ':fabric:1.21.1:assemble :forge:1.21.1:assemble :neoforge:1.21.1:assemble'
            java: 21
          - minecraft: '1.21.4'
            tasks: ':fabric:1.21.4:assemble :forge:1.21.4:assemble :neoforge:1.21.4:assemble'
            java: 21
          - minecraft: '26.2'
            tasks: ':fabric:26.2:assemble :forge:26.2:assemble :neoforge:26.2:assemble'
            java: 25
          - minecraft: '26.3'
            tasks: ':fabric:26.3:assemble :forge:26.3:assemble :neoforge:26.3:assemble'
            java: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize Target Submodules
        run: |
          if [ -f .gitmodules ]; then
            git submodule sync --recursive
            git submodule update --init --depth 1 shared "versions/${{ matrix.minecraft }}" || {
              for mod in shared "versions/${{ matrix.minecraft }}"; do
                rm -rf "$mod"
                branch=$(git config -f .gitmodules "submodule.${mod}.branch")
                sha=$(git ls-tree HEAD "$mod" | awk '{print $3}')
                url=$(git config -f .gitmodules "submodule.${mod}.url")
                git clone --depth 1 --branch "$branch" "$url" "$mod"
                git -C "$mod" fetch --depth 1 origin "$sha" || git -C "$mod" fetch --unshallow || true
                git -C "$mod" checkout "$sha"
              done
            }
          fi

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.java == 25 && 'zulu' || 'temurin' }}
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Targets
        run: |
          ./gradlew ${{ matrix.tasks }} --parallel --no-daemon --console=plain

      - name: Upload Target Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "buildscape-${{ matrix.minecraft }}"
          path: |
            build/${{ matrix.minecraft }}/*/libs/*.jar
            !build/${{ matrix.minecraft }}/*/libs/*-dev.jar
            !build/${{ matrix.minecraft }}/*/libs/*-sources.jar
          if-no-files-found: ignore
