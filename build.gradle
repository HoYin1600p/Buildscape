buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,7)'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '6.25.0'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def java17Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(17)
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = java17Launcher
}

def devClientMinHeap = providers.gradleProperty('dev_client_min_heap').getOrElse('512M')
def devClientMaxHeap = providers.gradleProperty('dev_client_max_heap').getOrElse('4G')
def heapMiB = { String value ->
    def match = value =~ /^([1-9][0-9]*)([mMgG])$/
    if (!match.matches()) throw new GradleException("Development heap '${value}' must use a positive M or G value.")
    new BigInteger(match[0][1]) * (match[0][2].equalsIgnoreCase('G') ? 1024 : 1)
}
if (heapMiB(devClientMinHeap) > heapMiB(devClientMaxHeap)) {
    throw new GradleException('dev_client_min_heap must not exceed dev_client_max_heap.')
}
def devRegistryLogging = providers.gradleProperty('dev_registry_logging').getOrElse('false').toBoolean()

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            // Registry debug dumps are expensive for the large block catalogue; enable when diagnosing registration.
            if (devRegistryLogging) property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'info'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            args '--username', 'Dev'

            jvmArgs "-Xmx${devClientMaxHeap}", "-Xms${devClientMinHeap}", '-XX:+UseG1GC'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'

            jvmArgs '-Xmx4G', '-Xms2G'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

sourceSets {
    main {
        resources { srcDir 'src/generated/resources' }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://dvs1.progwml6.com/files/maven/' }
    maven { url = 'https://modmaven.dev' }
    mavenCentral()
}

def rendererApi = providers.gradleProperty('renderer_api').getOrElse('embeddium')
def rendererApiCoordinates = [
        embeddium: 'curse.maven:embeddium-908741:5322305',
        rubidium : 'curse.maven:rubidium-574856:4494903'
]

if (!rendererApiCoordinates.containsKey(rendererApi)) {
    throw new GradleException("Unknown renderer_api '${rendererApi}'. Use 'embeddium' or 'rubidium'.")
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}:9.7.1.255")

    compileOnly fg.deobf(rendererApiCoordinates[rendererApi])

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'syncBundledRecipeCache'
    // Keep Gradle's input/output tracking: unchanged launches must not recopy the entire resource catalogue.
    // File-system watching retains snapshots between daemon runs; metadata inputs below still invalidate this task.

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/*.refmap.json'

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Formatting: `gradlew spotlessApply` rewrites, `gradlew spotlessCheck` verifies. Deliberately not part of `check`
// (enforceCheck = false) so a stray indent never fails a release build; run it before committing.
// The config screen package is excluded while it is under separate development.
spotless {
    enforceCheck = false
    lineEndings = com.diffplug.spotless.LineEnding.UNIX
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        targetExclude 'src/main/java/com/kingodogo/buildscape/client/screen/**',
                'src/test/java/com/kingodogo/buildscape/client/screen/**'
        eclipse().configFile('config/spotless/eclipse-formatter.xml')
    }
}

// Brace rule (config/checkstyle/checkstyle.xml): every if/else/for/while body needs braces.
checkstyle {
    toolVersion = '10.12.7'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}
// Checkstyle 10.x pulls in both guava and the old google-collections; keep guava (Checkstyle's documented workaround).
configurations.checkstyle {
    resolutionStrategy.capabilitiesResolution.withCapability('com.google.collections:google-collections') {
        select('com.google.guava:guava:0')
    }
}
tasks.withType(Checkstyle).configureEach {
    exclude '**/client/screen/**'
    reports {
        xml.required = false
        html.required = false
    }
}

tasks.register('verifyDevLaunch') {
    group = 'verification'
    description = 'Checks development client heap, Java toolchain and diagnostic logging without launching Minecraft.'
    doLast {
        def clientArgs = minecraft.runs.client.jvmArgs
        if (!clientArgs.contains("-Xms${devClientMinHeap}".toString())
                || !clientArgs.contains("-Xmx${devClientMaxHeap}".toString())) {
            throw new GradleException('Development client heap arguments were not applied.')
        }
        if (java17Launcher.get().metadata.languageVersion.asInt() != 17) {
            throw new GradleException('The development client requires Java 17.')
        }
        def registryMarkers = minecraft.runs.client.properties.get('forge.logging.markers')
        if ((registryMarkers == 'REGISTRIES') != devRegistryLogging) {
            throw new GradleException('Development registry logging does not match dev_registry_logging.')
        }
        logger.lifecycle("Development client: Java 17, initial heap ${devClientMinHeap}, maximum heap ${devClientMaxHeap}, registry logging ${devRegistryLogging}")
    }
}

tasks.named('compileJava', JavaCompile).configure {
    outputs.cacheIf { false }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(["Specification-Title"     : "buildscape",
                    "Specification-Vendor"    : "kingodogo",
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : "${version}",
                    "Implementation-Vendor"   : "kingodogo",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "${mod_id}.mixins.json"])
    }

    exclude { it.path.startsWith('.') || it.path.contains('..') }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-removal']
}

tasks.register('syncBundledRecipeCache', JavaExec) {
    group = 'buildscape'
    description = 'Compiles and synchronizes the bundled BDRE binary cache (recipes.bscb) directly from source JSONs.'
    dependsOn 'compileJava'
    classpath = files(tasks.compileJava.destinationDirectory) + sourceSets.main.compileClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.compiler.RecipeCacheGenerator'
    inputs.files(fileTree('src/main/resources/data/buildscape/recipes_pack') { include '*.json' })
    outputs.file file('src/main/resources/data/buildscape/recipes_pack/recipes.bscb')
    args file('src/main/resources/data/buildscape/recipes_pack').absolutePath,
            file('src/main/resources/data/buildscape/recipes_pack/recipes.bscb').absolutePath,
            file('run/buildscape/cache/recipes.bscb').absolutePath
}

tasks.register('compactizeRecipes', JavaExec) {
    group = 'buildscape'
    description = 'Formats all BDRE recipe pack JSON files into the compact canonical format.'
    dependsOn 'compileJava'
    classpath = files(tasks.compileJava.destinationDirectory) + sourceSets.main.compileClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.util.RecipePackFormatter'
    args file('src/main/resources/data/buildscape/recipes_pack').absolutePath
    finalizedBy 'syncBundledRecipeCache'
}

tasks.register('formatRecipes') {
    group = 'buildscape'
    description = 'Alias for compactizeRecipes.'
    dependsOn 'compactizeRecipes'
}

tasks.register('verifyBundledRecipeCache', JavaExec) {
    group = 'verification'
    description = 'Verifies that the bundled BDRE cache matches the compact recipe sources.'
    dependsOn 'compileJava'
    classpath = files(tasks.compileJava.destinationDirectory) + sourceSets.main.compileClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.compiler.BundledRecipeCacheVerify'
    args file('src/main/resources/data/buildscape/recipes_pack').absolutePath,
            file('src/main/resources/data/buildscape/recipes_pack/recipes.bscb').absolutePath
}

tasks.register('checkRecipePackFormat', JavaExec) {
    group = 'verification'
    description = 'Checks that recipe pack JSON has canonical compact formatting and unique keys.'
    dependsOn 'compileJava'
    classpath = files(tasks.compileJava.destinationDirectory) + sourceSets.main.compileClasspath
    mainClass = 'com.kingodogo.buildscape.recipe.framework.util.RecipePackFormatter'
    args '--check', file('src/main/resources/data/buildscape/recipes_pack').absolutePath
}

// When check/build includes synchronization, inspect committed inputs before any writes.
tasks.named('syncBundledRecipeCache').configure {
    mustRunAfter 'verifyBundledRecipeCache', 'checkRecipePackFormat', 'compactizeRecipes'
}
tasks.named('check').configure {
    dependsOn 'verifyBundledRecipeCache', 'checkRecipePackFormat'
}
