plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined'
}

evaluationDependsOn(':common')
def commonProject = project(':common')
version = providers.gradleProperty('mod_version').get()
base.archivesName = 'buildscape-forge-26.3'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Testing: the unimined dev runs (:forge:26.3:runServer / runClient) do not work yet with Forge 66.0.11. Findings,
// each fixed only for the next failure to show up (changes not kept):
//  1. FML wants a classpath jar named forge-26.3-66.0.11*, unimined names it minecraft_forge_*  -> copy/rename it.
//  2. unimined passes MOD_CLASSES=${source_roots} literally in Gradle runs -> set buildscape%%classes;buildscape%%resources,
//     and drop the classes dir from the classpath, or FML loads a second module "main" with the same packages.
//  3. runClient: unimined's union-relauncher cannot see jdk.nio.zipfs.ZipPath on JDK 25 -> use ForgeBootstrap directly.
//  4. Then both runs stop in ImmediateWindowHandler$DummyProvider.updateModuleReads (NoSuchElementException):
//     Class.forName(forge module, "net.minecraftforge.client.loading.NoVizFallback") returns null.
// So test this module with the release jar in the Prism instance "CMA 26.3 - Forge":
//   gradlew :forge:26.3:build -Pbuildscape.v263=true -Pbuildscape.forge263=true
//   then copy forge/26.3/build/libs/buildscape-forge-26.3-<version>.jar into the instance's mods folder.
unimined.minecraft {
    version '26.3'
    // Minecraft 26.x ships official names in development and production.
    defaultRemapJar = false
    minecraftForge {
        loader '66.0.11'
        mixinConfig(['buildscape.mixins.json', 'buildscape.forge263.mixins.json'])
    }
}

configurations { commonVariant }
dependencies {
    commonVariant project(path: ':common', configuration: 'v263Elements')
    // FML must see shared packages inside this mod rather than a second module.
    compileOnly files(commonProject.sourceSets.v263.output.classesDirs)
}

// common/src/v263/resources overlays the 26.2 resources: copy only the main files it leaves alone.
apply from: rootProject.file('gradle/v263-resources.gradle')

tasks.named('compileJava', JavaCompile) {
    dependsOn ':common:compileV263Java'
    inputs.files(commonProject.sourceSets.v263.output.classesDirs)
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // Both dev runs and the release jar must expose one FML module for shared packages.
    doLast {
        project.copy {
            from commonProject.sourceSets.v263.output.classesDirs
            into destinationDirectory
        }
    }
}
tasks.named('processResources') {
    v263MainResources(delegate)
    // The dev run reads the mixin config and the other overlay files from this module's own resources.
    from(v263OverlayDir) {
        // Forge's Mixin 0.8.7 only knows compatibility levels up to JAVA_21; an unknown level throws
        // MixinInitialisationError and the client exits silently while the config is registered.
        filesMatching('buildscape.mixins.json') {
            filter { line -> line.replace('"JAVA_25"', '"JAVA_21"') }
        }
    }
    inputs.dir(v263OverlayDir)
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.named('jar', Jar) {
    // Shared classes are already merged into main's output; the overlay resources are already in
    // processResources, so drop their copies carried by the common variant.
    from(configurations.commonVariant) {
        exclude '**/*.class'
        exclude v263ReplacedByOverlay
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes 'MixinConfigs': 'buildscape.mixins.json,buildscape.forge263.mixins.json' }
}
tasks.withType(JavaCompile).configureEach {
    options.release.set(25)
    options.compilerArgs += ['-proc:none']
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
