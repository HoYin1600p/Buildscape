if (targetPins.getProperty('forge.plugin') == 'xyz.wagyourtail.unimined' || gradle.gradleVersion.startsWith('9')) {
    apply plugin: 'xyz.wagyourtail.unimined'

    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }

    unimined.minecraft {
        version targetMinecraft
        if (targetMinecraft.startsWith('1.18') || targetMinecraft.startsWith('1.19') || targetMinecraft.startsWith('1.20')) {
            mappings {
                mojmap()
                searge()
            }
            defaultRemapJar = true
        } else {
            mappings {
                mojmap()
            }
            defaultRemapJar = false
        }
        minecraftForge {
            loader targetPins.getProperty('forge.version')
            mixinConfig(['buildscape.mixins.json', 'buildscape.forge.mixins.json'])
        }
    }
} else {
    apply plugin: 'net.minecraftforge.gradle'

    minecraft {
        mappings channel: targetPins.getProperty('forge.mappings.channel', 'official'), version: targetPins.getProperty('forge.mappings.version', targetMinecraft)
        runs {
            configureEach {
                def runDir = new File(templateRoot, "run/${targetMinecraft}/forge/${name}")
                try {
                    workingDirectory runDir
                } catch (Throwable ignored) {
                    workingDir = runDir
                }
                mods {
                    buildscape {
                        source sourceSets.main
                    }
                }
            }
            client {}
            server {}
        }
    }

    gradle.projectsEvaluated {
        tasks.matching { it.name.startsWith('run') }.configureEach {
            doFirst {
                new File(templateRoot, "run/${targetMinecraft}/forge/client").mkdirs()
                new File(templateRoot, "run/${targetMinecraft}/forge/server").mkdirs()
            }
        }
    }

    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }

    dependencies {
        minecraft "net.minecraftforge:forge:${targetMinecraft}-${targetPins.getProperty('forge.version')}"
    }
}
