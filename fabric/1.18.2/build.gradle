plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined'
}

version = providers.gradleProperty('mod_version').get()
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

unimined.minecraft {
    version '1.18.2'
    mappings {
        intermediary()
        mojmap()
    }
    defaultRemapJar = true
    fabric {
        loader '0.16.14'
        // Fabric API widens MenuType at runtime only; our compile and release jar need it too.
        accessWidener file('src/main/resources/buildscape.accesswidener')
    }
}

configurations { commonVariant }
dependencies {
    commonVariant project(path: ':common', configuration: 'v118xElements')
    implementation project(path: ':common', configuration: 'v118xElements')
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from(rootProject.file('common/src/v118x/resources')) {
        exclude 'META-INF/**', 'buildscape.mixins.json', '**/*.refmap.json'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('jar', Jar) {
    from configurations.commonVariant
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs += ['-proc:none']
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    standardInput = System.in
}
tasks.matching { it.name == 'remapJar' }.configureEach {
    prodNamespace 'intermediary'
    archiveClassifier = ''
    mixinRemap { enableBaseMixin() }
}
tasks.named('assemble') { dependsOn 'remapJar' }
