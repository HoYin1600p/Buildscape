plugins {
    id 'base'
}

ext.isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
ext.gradlewScript = file(ext.isWindows ? 'gradlew.bat' : 'gradlew').absolutePath

def configureJavaHome(Exec task, String loader = 'fabric') {
    def localProps = new Properties()
    def localFile = file('local.properties')
    if (localFile.isFile()) {
        localFile.withInputStream { localProps.load(it) }
    }
    def preferred = (loader == 'forge')
        ? (localProps.getProperty('java.21.home') ?: System.getenv('JAVA_21_HOME') ?: localProps.getProperty('java.25.home') ?: System.getenv('JAVA_25_HOME'))
        : (localProps.getProperty('java.25.home') ?: System.getenv('JAVA_25_HOME') ?: localProps.getProperty('java.21.home') ?: System.getenv('JAVA_21_HOME'))
    def javaHome = preferred ?: System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
    if (javaHome) {
        def dir = file(javaHome)
        if (dir.isDirectory()) {
            task.environment 'JAVA_HOME', dir.absolutePath
        }
    }
}

def prepareTargetRoot(File rootDir, String mc, String loader) {
    def targetDir = new File(rootDir, ".gradle/build-roots/${mc}/${loader}")
    targetDir.mkdirs()
    new File(targetDir, 'settings.gradle').text = "rootProject.name = 'buildscape-${mc}-${loader}'\n"
    new File(targetDir, 'build.gradle').text = new File(rootDir, 'build-logic/target.gradle').text
    new File(targetDir, 'gradle.properties').text = new File(rootDir, 'gradle.properties').text
    def localProps = new File(rootDir, 'local.properties')
    if (localProps.isFile()) {
        new File(targetDir, 'local.properties').text = localProps.text
    }

    def wrapperDir = new File(targetDir, 'gradle/wrapper')
    wrapperDir.mkdirs()
    def wrapperJar = new File(rootDir, 'gradle/wrapper/gradle-wrapper.jar')
    if (wrapperJar.isFile()) {
        new File(wrapperDir, 'gradle-wrapper.jar').bytes = wrapperJar.bytes
    }
    def gradlewBat = new File(rootDir, 'gradlew.bat')
    if (gradlewBat.isFile()) {
        new File(targetDir, 'gradlew.bat').text = gradlewBat.text
    }
    def gradlewSh = new File(rootDir, 'gradlew')
    if (gradlewSh.isFile()) {
        new File(targetDir, 'gradlew').text = gradlewSh.text
        new File(targetDir, 'gradlew').setExecutable(true)
    }

    def gradleVer = (loader == 'forge') ? '8.10.2' : '9.6.0'
    def daemonJvm = (loader == 'forge') ? '21' : '25'
    new File(wrapperDir, 'gradle-wrapper.properties').text = """distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\\://services.gradle.org/distributions/gradle-${gradleVer}-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
"""
    new File(targetDir, 'gradle/gradle-daemon-jvm.properties').text = "toolchainVersion=${daemonJvm}\n"
    return targetDir
}

def executeTarget(Project proj, String mc, String loader, String verb, List<String> extraArgs = []) {
    def targetDir = prepareTargetRoot(proj.projectDir, mc, loader)
    def script = proj.file(new File(targetDir, proj.ext.isWindows ? 'gradlew.bat' : 'gradlew')).absolutePath
    def cmd = [script, '-p', targetDir.absolutePath, "-PtemplateRoot=${proj.projectDir.absolutePath}", "-Pmc=${mc}", "-Ploader=${loader}"]
    cmd.addAll(extraArgs)
    cmd.add(verb)
    return cmd
}

tasks.register('buildTarget', Exec) {
    def mc = project.findProperty('mc') ?: '1.20.1'
    def loader = project.findProperty('loader') ?: 'fabric'
    configureJavaHome(it, loader)
    doFirst {
        commandLine executeTarget(project, mc, loader, 'build')
    }
}

tasks.named('build') {
    dependsOn 'buildTarget'
}

tasks.register('cleanTarget', Exec) {
    def mc = project.findProperty('mc') ?: '1.20.1'
    def loader = project.findProperty('loader') ?: 'fabric'
    configureJavaHome(it, loader)
    doFirst {
        commandLine executeTarget(project, mc, loader, 'clean')
    }
}

tasks.named('clean') {
    dependsOn 'cleanTarget'
}

tasks.register('runClient', Exec) {
    group = 'minecraft run'
    description = 'Runs the Minecraft client for the specified target (-Pmc=... -Ploader=...)'
    def mc = project.findProperty('mc') ?: '1.20.1'
    def loader = project.findProperty('loader') ?: 'fabric'
    configureJavaHome(it, loader)
    doFirst {
        commandLine executeTarget(project, mc, loader, 'runClient')
    }
}

tasks.register('runServer', Exec) {
    group = 'minecraft run'
    description = 'Runs the Minecraft server for the specified target (-Pmc=... -Ploader=...)'
    def mc = project.findProperty('mc') ?: '1.20.1'
    def loader = project.findProperty('loader') ?: 'fabric'
    configureJavaHome(it, loader)
    doFirst {
        commandLine executeTarget(project, mc, loader, 'runServer')
    }
}


tasks.register('collectModJars', Copy) {
    group = 'build'
    description = 'Collects the built target jars into build/libs'
    into layout.buildDirectory.dir('libs')
    from(file('build')) {
        include '*/*/libs/*.jar'
        exclude '*-dev.jar', '*-sources.jar'
        eachFile {
            path = name
        }
        includeEmptyDirs = false
    }
}
